[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .venv
    artifacts
    prototypes
    docs
    node_modules
markers =
    integration: 실제 외부 API(GitHub 등) 호출 — 네트워크 필요, CI 기본 제외
