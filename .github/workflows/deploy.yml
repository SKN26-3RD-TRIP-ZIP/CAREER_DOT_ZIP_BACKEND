# 배치: (Backend repo) .github/workflows/deploy.yml — 기존 주석본 대체(설계, 활성 전 Secrets 필요)
# 분리 레포 구조에 맞춤: 이 워크플로는 'backend' 이미지만 빌드/푸시 후 EC2 재배포.
# 프론트는 frontend repo 의 동일 패턴 워크플로가 'frontend' 이미지를 빌드/푸시한다.
# 최종 도메인/HTTPS 관련 값은 EC2 의 .env.prod 로 주입(여기서 다루지 않음 = DOMAIN_REQUIRED).
name: backend-deploy

on:
  # AWS 실환경 준비 완료 전까지 수동 실행만 허용
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 대상 (GitHub Environment 이름과 일치해야 함)"
        type: choice
        required: true
        default: production
        options:
          - development
          - production

concurrency:                    # 동시 배포 방지(환경별 독립)
  group: backend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    # environment 를 지정하면 동일 이름의 GitHub Environment 에 등록된 Secret 이
    # 레포 레벨 Secret 보다 우선 적용된다(없으면 레포 레벨로 폴백).
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag (commit SHA + 환경별 moving tag)
        id: tag
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          IMG=${{ secrets.DOCKERHUB_USERNAME }}/careerzip-backend
          docker build -f Dockerfile.prod -t $IMG:${{ steps.tag.outputs.sha }} -t $IMG:${{ steps.tag.outputs.moving }} .
          docker push $IMG:${{ steps.tag.outputs.sha }}
          docker push $IMG:${{ steps.tag.outputs.moving }}

      - name: Deploy on EC2 (migrate 1회 -> up -d -> health)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/CAREER_DOT_ZIP
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export BACKEND_TAG=${{ steps.tag.outputs.sha }}
            docker compose -f docker-compose.prod.yml pull backend
            # 마이그레이션은 1회용 잡으로만 (앱 컨테이너는 RUN_MIGRATIONS=0)
            docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
            docker compose -f docker-compose.prod.yml up -d backend
            # 헬스 확인(실패 시 비정상 종료 -> 배포 실패로 표시)
            for i in $(seq 1 10); do
              curl -fsS http://localhost:8000/api/v1/health/ready && break || sleep 5
            done

# 필요한 GitHub Secrets:
#   레포 레벨(공용): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   Environment 레벨(development / production 각각 별도 값):
#     EC2_HOST, EC2_USER, EC2_SSH_KEY
#   ※ Settings → Environments 에서 development/production 을 만들고 그 안에 위 3개를 등록.
#      (레포 레벨에도 같은 이름이 있으면 Environment 쪽 값이 우선한다)
# 실행: Actions 탭에서 backend-deploy 워크플로 실행 시 environment 입력값으로 development/production 선택.
# 롤백: EC2 에서 BACKEND_TAG=<직전 SHA> 로 docker compose up -d backend (이미지 태그 보존).
