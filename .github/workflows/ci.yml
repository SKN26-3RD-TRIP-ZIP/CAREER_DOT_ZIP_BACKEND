# 배치: (Backend repo) .github/workflows/ci.yml  — 기존 전체 주석본 대체(활성)
# 도메인 불필요. develop/main PR 에서 백엔드 검증.
name: backend-ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:                      # 동일 브랜치 중복 실행 취소
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check + migrations + unit tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret
      DEBUG: "True"
      OPENAI_USE_MOCK: "true"
      OPENAI_API_KEY: sk-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "System deps (mysqlclient/ffmpeg build)"
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev ffmpeg

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install torch==2.12.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: "Unit tests (accounts OAuth/Redis/auth)"
        run: python manage.py test apps.accounts -v1

  docker-build:
    name: prod image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Build Dockerfile.prod (no push)"
        run: docker build -f Dockerfile.prod -t careerzip-backend:ci .

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
