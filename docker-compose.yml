# 로컬 개발 환경용 docker-compose 설정
# 실행: docker compose up --build

version: "3.9"

services:
  # 프론트엔드 (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # 호스트의 node_modules와 충돌 방지
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - app-network
    depends_on:
      - backend

  # 백엔드 (Django + DRF)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env.local
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - app-network
    # depends_on:
    #   - redis  # [Redis 준비 전 주석 처리]

  # [Redis 준비 전 주석 처리] 세션 클러스터링 + 폴링 태스크 상태 저장
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - app-network

# volumes:
#   redis_data:  # [Redis 준비 전 주석 처리]

networks:
  app-network:
    driver: bridge
